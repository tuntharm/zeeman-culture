<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A shared idea, a local expression</title>
  <desc id="desc">An original editorial illustration of two creator-brief pages, one forest green and one ivory, connected by a botanical ink stem. The pages distinguish a shared idea from local expression.</desc>
